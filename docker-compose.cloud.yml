# Cloud deployment override — apply on top of docker-compose.yml:
#   docker-compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#
# Differences vs. local:
#   - PostgreSQL port NOT exposed externally
#   - CORS_ORIGINS locked to your real domain
#   - Nginx reverse proxy with TLS termination (fill DOMAIN below)
#   - Restart policy: always

services:

  db:
    restart: always
    ports: []    # remove the host-port mapping; DB unreachable from outside

  server:
    restart: always
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your domain, e.g. https://pos.example.com}

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro    # mount your TLS certs here
    depends_on:
      - server
