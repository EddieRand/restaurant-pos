<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2f2f"/>
      <stop offset="55%" stop-color="#7c3f1d"/>
      <stop offset="100%" stop-color="#ff5c00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#g)"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <!-- plate -->
  <circle cx="300" cy="430" r="170" fill="#ffffff" opacity="0.08"/>
  <circle cx="300" cy="430" r="120" fill="#ffffff" opacity="0.10"/>
  <!-- steam -->
  <path d="M250 230 q15 -30 0 -60 q-15 -30 0 -60" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M310 230 q15 -30 0 -60 q-15 -30 0 -60" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M370 230 q15 -30 0 -60 q-15 -30 0 -60" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- cup -->
  <rect x="240" y="380" width="120" height="90" rx="14" fill="#ffffff" opacity="0.12"/>
  <path d="M360 400 q40 0 40 35 q0 35 -40 35" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10" fill="none"/>
  <!-- bottom decorative dots -->
  <circle cx="80" cy="700" r="6" fill="#ffffff" opacity="0.2"/>
  <circle cx="120" cy="730" r="4" fill="#ffffff" opacity="0.15"/>
  <circle cx="520" cy="690" r="8" fill="#ffffff" opacity="0.18"/>
  <circle cx="480" cy="740" r="5" fill="#ffffff" opacity="0.12"/>
</svg>
